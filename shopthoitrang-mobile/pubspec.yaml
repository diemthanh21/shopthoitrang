name: shopthoitrang_mobile
publish_to: 'none'
description: Ứng dụng Flutter cho khách hàng Shop Thời Trang
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.20.2

  # Routing
  go_router: ^17.0.0

  # UI
  flutter_svg: ^2.0.10+1

  # JWT decode (tùy chọn)
  jwt_decoder: ^2.0.1

  # Image picker
  image_picker: ^1.0.7
  permission_handler: ^12.0.1
  url_launcher: ^6.3.0
  webview_flutter: ^4.7.0
  qr_flutter: ^4.1.0
  app_links: ^6.3.2

  # Supabase storage for media uploads
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
